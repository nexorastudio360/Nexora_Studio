<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Viewport & Device Support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO: Primary Title & Description -->
    <title>Nexora Studio | Web Design & Custom Software Development</title>
    <meta name="description" content="Premium global digital innovation company. Expert custom software development, UI/UX design, and AI solutions for enterprises." />

    <!-- SEO: Core Meta Tags -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Nexora Studio" />
    <meta name="creator" content="Nexora Studio" />
    <meta name="publisher" content="Nexora Studio" />
    <meta name="category" content="Technology" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://nexora-studio-360.vercel.app/" />

    <!-- Open Graph Protocol (Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nexora-studio-360.vercel.app/" />
    <meta property="og:title" content="Nexora Studio | Premium Web Design & Custom Software" />
    <meta property="og:description" content="Transform your vision into reality. Premium global digital innovation company delivering expert custom software, AI-powered solutions, and world-class UI/UX design." />
    <meta property="og:site_name" content="Nexora Studio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://nexora-studio-360.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://nexora-studio-360.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:alt" content="Nexora Studio - Premium Enterprise AI Workspace and Digital Innovation Platform" />

    <!-- Twitter Card Protocol (Social Sharing for X/Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexora Studio | Enterprise Web Design & AI Solutions" />
    <meta name="twitter:description" content="Premium digital innovation company delivering custom software, AI-powered solutions, and world-class UI/UX design for enterprises globally." />
    <meta name="twitter:image" content="https://nexora-studio-360.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="Nexora Studio - Premium Enterprise AI Workspace and Digital Innovation Platform" />
    <meta name="twitter:url" content="https://nexora-studio-360.vercel.app/" />
    <meta name="twitter:site" content="@NexoraStudio" />
    <meta name="twitter:creator" content="@NexoraStudio" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme & Branding -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="application-name" content="Nexora Studio" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexora Studio" />

    <!-- Format Detection & Smart App Banners -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />

    <!-- Generator Tag -->
    <meta name="generator" content="React + Vite + Express" />

    <!-- Resource Hints -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Styles & Assets -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Grotesk:wght@300..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
